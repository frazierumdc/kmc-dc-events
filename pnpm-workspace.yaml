packages:
  - apps/*
  - packages/*
  - e2e
  - brand
allowBuilds:
  "@firebase/util": false
  protobufjs: false
  re2: false
  sharp: false
  esbuild: false
# Security fixes for packages this workspace does not depend on directly, where the package
# that does has no release yet that takes the fixed version (pnpm audit --prod, 18 Nov 2026).
# Each is used only until its parent catches up: remove it when `pnpm audit --prod` stays
# clean without it. They change what pnpm installs here and in the job's image. They do not
# reach the functions in the cloud, where Firebase's build runs npm on its own.
overrides:
  # GHSA for fflate <0.7.5, through satori > @shuding/opentype.js, which asks for ^0.7.3:
  # 0.7.5 is inside that range, but updating did not move the locked 0.7.3, so it is named here.
  "fflate@>=0.7.0 <0.7.5": "0.7.5"
  # GHSA-f596-whhp-79r4 and one more for @grpc/grpc-js <1.13.6. The Firebase web SDK's
  # Firestore pins ~1.9.0 and has no release with the fix. Same major version; the app uses
  # no Firestore, so this code is never in the app's bundle.
  "@firebase/firestore>@grpc/grpc-js": "^1.13.6"
  # GHSA-3g3m-2fjr-6pw4 (glob <14.0.2) and GHSA-g3hv-75wg-m249 (minimatch <11.0.1) come only
  # through rimraf 5, which google-gax and gaxios (under firebase-admin) list but never load
  # at run time. rimraf 6 takes the fixed glob. A major version of a package no code here runs.
  "rimraf@5": "^6.1.4"
  # Dependabot alerts (19 Nov 2026). Every copy these replace came through build and developer
  # tools only (firebase-tools, eslint, workbox-build, the Hono dev server), not the app or the job.
  # Left open: @opentelemetry/core 1.x under firebase-tools (moderate; the fix is a major version).
  # Same-major fixes:
  "undici@>=6 <6.29.1": "^6.29.1"
  "undici@>=8 <8.12.2": "^8.12.2"
  "fast-uri@>=3 <3.1.9": "^3.1.9"
  "hono@<4.13.16": "^4.13.16"
  "@hono/node-server@>=2 <2.1.6": "^2.1.6"
  "serialize-javascript@<7.1.3": "^7.1.3"
  # Major-version fixes where the parent has no release with the fixed version yet; the tests,
  # lint and both builds pass with them:
  "glob@>=9 <14.0.2": "^14.0.2"
  "minimatch@>=7 <11.0.1": "^11.0.1"
  "uuid@<11.1.1": "^11.1.1"
  "basic-ftp@<6.2.4": "^6.2.4"
  "ip-address@>=10 <10.7.4": "^10.7.4"
